2="191.4"/><polygon class="glf-acc" points="150.4,191.4 144.9,188.8 144.9,193.9"/><text class="sa" x="148.8" y="206" text-anchor="start"> (−q)</text></g><g><text class="t" x="44.0" y="236" text-anchor="middle">F</text><line class="gl-mut" x1="41.3" y1="222.9" x2="45.6" y2="222.9"/><polygon class="glf-mut" points="47.1,222.9 41.7,220.3 41.7,225.4"/><text class="t" x="47.2" y="236" text-anchor="start"> = q (</text><text class="t" x="78.0" y="236" text-anchor="middle">v</text><line class="gl-mut" x1="75.3" y1="222.9" x2="79.6" y2="222.9"/><polygon class="glf-mut" points="81.1,222.9 75.7,220.3 75.7,225.4"/><text class="t" x="81.2" y="236" text-anchor="start"> × </text><text class="t" x="98.0" y="236" text-anchor="middle">B</text><line class="gl-mut" x1="95.3" y1="222.9" x2="99.6" y2="222.9"/><polygon class="glf-mut" points="101.1,222.9 95.7,220.3 95.7,225.4"/><text class="t" x="101.2" y="236" text-anchor="start">)  perpendicular al plano</text></g><text class="tb" x="365" y="50" text-anchor="middle">Convención 3D</text><g><text class="sc" x="354.4" y="93" text-anchor="middle">B</text><line class="gl-cop" x1="352.4" y1="78.4" x2="358.9" y2="78.4"/><polygon class="glf-cop" points="360.4,78.4 354.9,75.8 354.9,80.9"/><text class="sc" x="358.8" y="93" text-anchor="start"> </text><circle class="gl-cop" cx="371.7" cy="87.4" r="6.1"/><line class="gl-cop" x1="367.3" y1="83.1" x2="376.0" y2="91.7"/><line class="gl-cop" x1="367.3" y1="91.7" x2="376.0" y2="83.1"/></g><text class="t" x="350" y="110" text-anchor="start">entra a la hoja</text><g><text class="sc" x="354.4" y="156" text-anchor="middle">B</text><line class="gl-cop" x1="352.4" y1="141.4" x2="358.9" y2="141.4"/><polygon class="glf-cop" points="360.4,141.4 354.9,138.8 354.9,143.9"/><text class="sc" x="358.8" y="156" text-anchor="start"> </text><circle class="gl-cop" cx="371.7" cy="150.4" r="6.1"/><circle class="glf-cop" cx="371.7" cy="150.4" r="1.7"/></g><text class="t" x="350" y="173" text-anchor="start">sale de la hoja</text></svg>