<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 240" style="max-width:824px" role="img" aria-label="Conexión de amperímetro real, voltímetro real y puente de Wheatstone">
<style>
  :root {
    --surface: #ffffff; --ink: #142030; --muted: #566273; --line: #d8dee7;
    --accent: #1f4fd1; --accent-soft: #e7edfc; --copper: #a85a18; --copper-soft: #f8eee4;
    --font-body: "Source Sans 3", "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #151c26; --ink: #e5eaf1; --muted: #9aa6b6; --line: #29323f;
      --accent: #84a6ff; --accent-soft: #1b2640; --copper: #e2a26b; --copper-soft: #2a2119;
    }
  }
  svg { background: var(--surface); font-family: var(--font-body); }
  .w { stroke: var(--ink); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .wk { stroke: var(--ink); stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .m { stroke: var(--muted); stroke-width: 1.2; fill: none; }
  .md { stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 4 4; fill: none; }
  .a { stroke: var(--accent); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ad { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
  .c { stroke: var(--copper); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .cd { stroke: var(--copper); stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
  .fld { stroke: var(--muted); stroke-width: 1.3; opacity: .38; }
  .fldl { stroke: var(--muted); stroke-width: 1.4; opacity: .6; fill: none; }
  .af { fill: var(--accent); } .cf { fill: var(--copper); } .wf, .inkf, .wkf { fill: var(--ink); }
  .mf, .mdf { fill: var(--muted); } .fldlf { fill: var(--muted); opacity: .6; }
  .adf { fill: var(--accent); } .cdf { fill: var(--copper); }
  .soft { fill: var(--accent-soft); } .csoft { fill: var(--copper-soft); } .paperf { fill: var(--surface); }
  .nostroke { stroke: none; } .nofill { fill: none; }
  .s, .sa, .sc { font: italic 17px "Times New Roman", "STIX Two Text", serif; fill: var(--ink); }
  .sa { fill: var(--accent); } .sc { fill: var(--copper); }
  .t { font: 12.5px var(--font-body); fill: var(--muted); }
  .tb { font: 600 14px var(--font-body); fill: var(--ink); }
  .tc { font: 600 13px var(--font-body); fill: var(--copper); }
  .ta { font: 600 13px var(--font-body); fill: var(--accent); }
  .tw { font: 700 13px var(--font-body); fill: var(--surface); }
  .gl-ink, .gl-acc, .gl-cop, .gl-mut, .gl-srf { fill: none; stroke-width: 1.2; stroke-linecap: round; }
  .gl-ink { stroke: var(--ink); } .gl-acc { stroke: var(--accent); } .gl-cop { stroke: var(--copper); }
  .gl-mut { stroke: var(--muted); } .gl-srf { stroke: var(--surface); }
  .glf-ink { fill: var(--ink); } .glf-acc { fill: var(--accent); } .glf-cop { fill: var(--copper); }
  .glf-mut { fill: var(--muted); } .glf-srf { fill: var(--surface); }
  .sb { font-size: 72%; }
</style>
<g transform="translate(42,56) rotate(90)"><line class="w" x1="0" y1="0" x2="52" y2="0"/><line class="w" x1="60" y1="0" x2="112" y2="0"/><line class="w" x1="52" y1="-15" x2="52" y2="15"/><line class="wk" x1="60" y1="-8" x2="60" y2="8"/></g><g transform="translate(42,56) rotate(0)"><line class="w" x1="0" y1="0" x2="42" y2="0"/><line class="w" x1="68" y1="0" x2="110" y2="0"/></g><circle class="w paperf" cx="97" cy="56" r="13"/><g transform="translate(152,56) rotate(90)"><polyline class="w" points="0,0 34,0 37.7,8 45,-8 52.3,8 59.7,-8 67,8 74.3,-8 78,0 112,0"/></g><polyline class="w" points="152,168 42,168"/><line class="md" x1="204" y1="16" x2="204" y2="226"/><g transform="translate(248,56) rotate(90)"><line class="w" x1="0" y1="0" x2="52" y2="0"/><line class="w" x1="60" y1="0" x2="112" y2="0"/><line class="w" x1="52" y1="-15" x2="52" y2="15"/><line class="wk" x1="60" y1="-8" x2="60" y2="8"/></g><polyline class="w" points="248,56 308,56 358,56"/><polyline class="w" points="248,168 308,168 358,168"/><g transform="translate(308,56) rotate(90)"><polyline class="w" points="0,0 34,0 37.7,8 45,-8 52.3,8 59.7,-8 67,8 74.3,-8 78,0 112,0"/></g><g transform="translate(358,56) rotate(90)"><line class="w" x1="0" y1="0" x2="43" y2="0"/><line class="w" x1="69" y1="0" x2="112" y2="0"/></g><circle class="w paperf" cx="358" cy="112" r="13"/><line class="md" x1="434" y1="16" x2="434" y2="226"/><g transform="translate(522,52) rotate(42.0892)"><polyline class="w" points="0,0 19.8,0 23.4,8 30.8,-8 38.1,8 45.4,-8 52.8,8 60.1,-8 63.8,0 83.5,0"/></g><g transform="translate(584,108) rotate(137.911)"><polyline class="w" points="0,0 19.8,0 23.4,8 30.8,-8 38.1,8 45.4,-8 52.8,8 60.1,-8 63.8,0 83.5,0"/></g><g transform="translate(522,164) rotate(-137.911)"><polyline class="w" points="0,0 19.8,0 23.4,8 30.8,-8 38.1,8 45.4,-8 52.8,8 60.1,-8 63.8,0 83.5,0"/></g><g transform="translate(460,108) rotate(-42.0892)"><polyline class="w" points="0,0 19.8,0 23.4,8 30.8,-8 38.1,8 45.4,-8 52.8,8 60.1,-8 63.8,0 83.5,0"/></g><g transform="translate(460,108) rotate(0)"><line class="w" x1="0" y1="0" x2="51" y2="0"/><line class="w" x1="73" y1="0" x2="124" y2="0"/></g><circle class="w paperf" cx="522" cy="108" r="11"/><circle class="inkf" cx="308" cy="56" r="3.6"/><circle class="inkf" cx="308" cy="168" r="3.6"/><circle class="inkf" cx="522" cy="52" r="3.6"/><circle class="inkf" cx="584" cy="108" r="3.6"/><circle class="inkf" cx="522" cy="164" r="3.6"/><circle class="inkf" cx="460" cy="108" r="3.6"/><text class="tb" x="98" y="22" text-anchor="middle">a) Amperímetro (serie)</text><text class="s" x="24" y="117" text-anchor="end">ε</text><text class="tb" x="66" y="103" text-anchor="middle">+</text><text class="tb" x="66" y="129" text-anchor="middle">−</text><text class="tb" x="97" y="61" text-anchor="middle">A</text><text class="ta" x="97" y="82" text-anchor="middle">rₐ ideal = 0</text><text class="s" x="170" y="117" text-anchor="start">R</text><text class="t" x="98" y="206" text-anchor="middle">I<tspan class="sb" dy="3.5">med</tspan><tspan dy="-3.5"> = ε / (R + rₐ)</tspan></text><text class="tb" x="314" y="22" text-anchor="middle">b) Voltímetro (paralelo)</text><text class="s" x="230" y="117" text-anchor="end">ε</text><text class="tb" x="272" y="103" text-anchor="middle">+</text><text class="tb" x="272" y="129" text-anchor="middle">−</text><text class="s" x="292" y="117" text-anchor="end">R</text><text class="tb" x="358" y="117" text-anchor="middle">V</text><text class="ta" x="376" y="117" text-anchor="start">rᵥ → ∞</text><text class="t" x="314" y="206" text-anchor="middle">Mide ΔV entre nodos</text><text class="tb" x="522" y="22" text-anchor="middle">c) Puente nulo</text><text class="s" x="553" y="60" text-anchor="middle">R₂</text><text class="s" x="553" y="163" text-anchor="middle">Rₓ</text><text class="s" x="491" y="163" text-anchor="middle">R₃</text><text class="s" x="491" y="60" text-anchor="middle">R₁</text><text class="tb" x="522" y="113" text-anchor="middle">G</text><text class="ta" x="522" y="134" text-anchor="middle">I<tspan class="sb" dy="3.5">G</tspan><tspan dy="-3.5"> = 0</tspan></text><text class="tb" x="522" y="206" text-anchor="middle">Rₓ = R₃(R₂/R₁)</text></svg>