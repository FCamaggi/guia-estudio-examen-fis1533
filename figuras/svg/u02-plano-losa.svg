<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 250" style="max-width:668px" role="img" aria-label="Simetría planar: losa infinita de espesor 2a con densidad ρ y pastillero gaussiano">
<style>
  :root {
