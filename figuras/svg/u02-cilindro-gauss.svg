anchor="start">d</text><text class="sc" x="333.4" y="150" text-anchor="middle">A</text><line class="gl-cop" x1="331.4" y1="135.4" x2="337.9" y2="135.4"/><polygon class="glf-cop" points="339.4,135.4 333.9,132.8 333.9,137.9"/></g><g><text class="sa" x="319.4" y="120" text-anchor="middle">E</text><line class="gl-acc" x1="317.4" y1="105.4" x2="323.9" y2="105.4"/><polygon class="glf-acc" points="325.4,105.4 319.9,102.8 319.9,107.9"/></g><text class="tb" x="392" y="62" text-anchor="start">manto:</text><text class="s" x="392" y="82" text-anchor="start">Φ = E(2πrL)</text><text class="tb" x="392" y="116" text-anchor="start">tapas:</text><g><text class="s" x="396.4" y="136" text-anchor="middle">E</text><line class="gl-ink" x1="394.4" y1="121.4" x2="400.9" y2="121.4"/><polygon class="glf-ink" points="402.4,121.4 396.9,118.8 396.9,123.9"/><text class="s" x="400.8" y="136" text-anchor="start"> ⊥ n̂ ⇒ Φ = 0</text></g></svg>