ass="s" x="319.057" y="119.258" text-anchor="middle">ra</text><text class="s" x="334.498" y="83.267" text-anchor="middle">rb</text><text class="sa" x="260.003" y="65.8261" text-anchor="end">r</text><g><text class="sa" x="326.3" y="31.6218" text-anchor="middle">E</text><line class="gl-acc" x1="324.3" y1="17.0" x2="330.7" y2="17.0"/><polygon class="glf-acc" points="332.2,17.0 326.8,14.5 326.8,19.6"/></g><text class="t" x="295" y="208" text-anchor="middle">(b) Cilíndrico coaxial (largo L)</text><text class="tc" x="482" y="107" text-anchor="end">+Q</text><text class="s" x="518.463" y="120.484" text-anchor="middle">ra</text><text class="s" x="527.795" y="85.492" text-anchor="middle">rb</text><text class="ta" x="442" y="46" text-anchor="end">−Q</text><text class="sa" x="461.057" y="65.2339" text-anchor="end">r</text><text class="t" x="492" y="208" text-anchor="middle">(c) Cascarones esféricos</text></svg>