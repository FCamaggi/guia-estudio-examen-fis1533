/><text class="sa" x="266.8" y="132" text-anchor="start"> = </text><text class="sa" x="289.6" y="132" text-anchor="middle">D</text><line class="gl-acc" x1="287.6" y1="117.4" x2="294.1" y2="117.4"/><polygon class="glf-acc" points="295.6,117.4 290.1,114.8 290.1,119.9"/><text class="sa" x="294.0" y="132" text-anchor="start">/ε  (en el dieléctrico)</text></g><g><text class="s" x="262.4" y="162" text-anchor="middle">P</text><line class="gl-ink" x1="260.4" y1="147.4" x2="266.9" y2="147.4"/><polygon class="glf-ink" points="268.4,147.4 262.9,144.8 262.9,149.9"/><text class="s" x="266.8" y="162" text-anchor="start"> = (ε − ε₀) </text><text class="s" x="350.1" y="162" text-anchor="middle">E</text><line class="gl-ink" x1="348.1" y1="147.4" x2="354.6" y2="147.4"/><polygon class="glf-ink" points="356.1,147.4 350.6,144.8 350.6,149.9"/></g><text class="t" x="258" y="192" text-anchor="start">−σb en r = a,  +σb en r = b</text></svg>