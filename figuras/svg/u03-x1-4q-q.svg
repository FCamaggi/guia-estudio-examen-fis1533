<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" style="max-width:621px" role="img" aria-label="Cargas +4Q en x = 0 y −Q en x = L; punto P en x = 2L donde E = 0">
<style>
  :root {
