af" points="500,196 492.0,200.0 492.0,192.0"/><text class="s" x="30" y="125" text-anchor="end">C</text><text class="s" x="190" y="42" text-anchor="middle">R</text><text class="s" x="270" y="125" text-anchor="start">L</text><text class="s" x="84" y="30" text-anchor="middle">S</text><text class="tc" x="72" y="105" text-anchor="start">+q</text><text class="ta" x="72" y="150" text-anchor="start">−q</text><text class="sa" x="145" y="215" text-anchor="middle">i</text><text class="t" x="150" y="232" text-anchor="middle">(a) sin fuente</text><text class="s" x="410" y="42" text-anchor="middle">R</text><text class="s" x="510" y="42" text-anchor="middle">L</text><text class="s" x="580" y="125" text-anchor="start">C</text><text class="s" x="405" y="112" text-anchor="start">V(t)</text><text class="t" x="405" y="132" text-anchor="start">= V₀ cos ωt</text><text class="sa" x="465" y="215" text-anchor="middle">i(t)</text><text class="t" x="460" y="232" text-anchor="middle">(b) con fuente</text></svg>