<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 248" style="max-width:688px" role="img" aria-label="Asociación de resistores en serie, en paralelo y puente de Wheatstone">
<style>
  :root {
    --surface: #ffffff; --ink: #142030; --muted: #566273; --line: #d8dee7;
    --accent: #1f4fd1; --accent-soft: #e7edfc; --copper: #a85a18; --copper-soft: #f8eee4;
    --font-body: "Source Sans 3", "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #151c26; --ink: #e5eaf1; --muted: #9aa6b6; --line: #29323f;
      --accent: #84a6ff; --accent-soft: #1b2640; --copper: #e2a26b; --copper-soft: #2a2119;
    }
  }
  svg { background: var(--surface); font-family: var(--font-body); }
  .w { stroke: var(--ink); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .wk { stroke: var(--ink); stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .m { stroke: var(--muted); stroke-width: 1.2; fill: none; }
  .md { stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 4 4; fill: none; }
  .a { stroke: var(--accent); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ad { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
  .c { stroke: var(--copper); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .cd { stroke: var(--copper); stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
  .fld { stroke: var(--muted); stroke-width: 1.3; opacity: .38; }
  .fldl { stroke: var(--muted); stroke-width: 1.4; opacity: .6; fill: none; }
  .af { fill: var(--accent); } .cf { fill: var(--copper); } .wf, .inkf, .wkf { fill: var(--ink); }
  .mf, .mdf { fill: var(--muted); } .fldlf { fill: var(--muted); opacity: .6; }
  .adf { fill: var(--accent); } .cdf { fill: var(--copper); }
  .soft { fill: var(--accent-soft); } .csoft { fill: var(--copper-soft); } .paperf { fill: var(--surface); }
  .nostroke { stroke: none; } .nofill { fill: none; }
  .s, .sa, .sc { font: italic 17px "Times New Roman", "STIX Two Text", serif; fill: var(--ink); }
  .sa { fill: var(--accent); } .sc { fill: var(--copper); }
  .t { font: 12.5px var(--font-body); fill: var(--muted); }
  .tb { font: 600 14px var(--font-body); fill: var(--ink); }
  .tc { font: 600 13px var(--font-body); fill: var(--copper); }
  .ta { font: 600 13px var(--font-body); fill: var(--accent); }
  .tw { font: 700 13px var(--font-body); fill: var(--surface); }
  .gl-ink, .gl-acc, .gl-cop, .gl-mut, .gl-srf { fill: none; stroke-width: 1.2; stroke-linecap: round; }
  .gl-ink { stroke: var(--ink); } .gl-acc { stroke: var(--accent); } .gl-cop { stroke: var(--copper); }
  .gl-mut { stroke: var(--muted); } .gl-srf { stroke: var(--surface); }
  .glf-ink { fill: var(--ink); } .glf-acc { fill: var(--accent); } .glf-cop { fill: var(--copper); }
  .glf-mut { fill: var(--muted); } .glf-srf { fill: var(--surface); }
  .sb { font-size: 72%; }
</style>
<g transform="translate(20,102) rotate(0)"><polyline class="w" points="0,0 10.1,0 13.3,8 19.6,-8 25.9,8 32.1,-8 38.4,8 44.7,-8 47.9,0 58,0"/></g><g transform="translate(78,102) rotate(0)"><polyline class="w" points="0,0 10.1,0 13.3,8 19.6,-8 25.9,8 32.1,-8 38.4,8 44.7,-8 47.9,0 58,0"/></g><line class="md" x1="154" y1="18" x2="154" y2="228"/><polyline class="w" points="172,102 188,102"/><polyline class="w" points="284,102 300,102"/><polyline class="w" points="188,102 188,72 198,72"/><polyline class="w" points="274,72 284,72 284,102"/><g transform="translate(198,72) rotate(0)"><polyline class="w" points="0,0 16,0 19.7,8 27,-8 34.3,8 41.7,-8 49,8 56.3,-8 60,0 76,0"/></g><polyline class="w" points="188,102 188,132 198,132"/><polyline class="w" points="274,132 284,132 284,102"/><g transform="translate(198,132) rotate(0)"><polyline class="w" points="0,0 16,0 19.7,8 27,-8 34.3,8 41.7,-8 49,8 56.3,-8 60,0 76,0"/></g><line class="md" x1="320" y1="18" x2="320" y2="228"/><g transform="translate(416,58) rotate(43.0251)"><polyline class="w" points="0,0 19,0 22.7,8 30,-8 37.4,8 44.7,-8 52,8 59.4,-8 63,0 82.1,0"/></g><g transform="translate(476,114) rotate(136.975)"><polyline class="w" points="0,0 19,0 22.7,8 30,-8 37.4,8 44.7,-8 52,8 59.4,-8 63,0 82.1,0"/></g><g transform="translate(416,170) rotate(-136.975)"><polyline class="w" points="0,0 19,0 22.7,8 30,-8 37.4,8 44.7,-8 52,8 59.4,-8 63,0 82.1,0"/></g><g transform="translate(356,114) rotate(-43.0251)"><polyline class="w" points="0,0 19,0 22.7,8 30,-8 37.4,8 44.7,-8 52,8 59.4,-8 63,0 82.1,0"/></g><g transform="translate(356,114) rotate(0)"><polyline class="w" points="0,0 38,0 41.7,8 49,-8 56.3,8 63.7,-8 71,8 78.3,-8 82,0 120,0"/></g><circle class="inkf" cx="20" cy="102" r="3.6"/><circle class="inkf" cx="136" cy="102" r="3.6"/><line class="a" x1="32" y1="135" x2="116.0" y2="135.0"/><polygon class="af" points="124,135 116.0,139.0 116.0,131.0"/><circle class="inkf" cx="172" cy="102" r="3.6"/><circle class="inkf" cx="300" cy="102" r="3.6"/><circle class="inkf" cx="188" cy="102" r="3.6"/><circle class="inkf" cx="284" cy="102" r="3.6"/><circle class="inkf" cx="416" cy="58" r="3.6"/><circle class="inkf" cx="476" cy="114" r="3.6"/><circle class="inkf" cx="416" cy="170" r="3.6"/><circle class="inkf" cx="356" cy="114" r="3.6"/><text class="tb" x="78" y="22" text-anchor="middle">a) Serie (misma I)</text><text class="s" x="20" y="92" text-anchor="middle">a</text><text class="s" x="136" y="92" text-anchor="middle">b</text><text class="s" x="49" y="84" text-anchor="middle">R₁</text><text class="s" x="107" y="84" text-anchor="middle">R₂</text><text class="sa" x="78" y="154" text-anchor="middle">I</text><text class="tb" x="78" y="188" text-anchor="middle">R<tspan class="sb" dy="3.5">eq</tspan><tspan dy="-3.5"> = R₁ + R₂</tspan></text><text class="tb" x="236" y="22" text-anchor="middle">b) Paralelo (mismo ΔV)</text><text class="s" x="172" y="90" text-anchor="middle">a</text><text class="s" x="300" y="90" text-anchor="middle">b</text><text class="s" x="236" y="56" text-anchor="middle">R₁</text><text class="s" x="236" y="157" text-anchor="middle">R₂</text><text class="tb" x="236" y="188" text-anchor="middle">1/R<tspan class="sb" dy="3.5">eq</tspan><tspan dy="-3.5"> = 1/R₁ + 1/R₂</tspan></text><text class="tb" x="416" y="22" text-anchor="middle">c) Puente (no reducible)</text><text class="s" x="446" y="64" text-anchor="middle">R₂</text><text class="s" x="446" y="169" text-anchor="middle">R₄</text><text class="s" x="386" y="169" text-anchor="middle">R₃</text><text class="s" x="386" y="64" text-anchor="middle">R₁</text><text class="s" x="416" y="98" text-anchor="middle">R₅</text><text class="s" x="416" y="44" text-anchor="middle">a</text><text class="s" x="490" y="119" text-anchor="start">c</text><text class="s" x="416" y="196" text-anchor="middle">d</text><text class="s" x="342" y="119" text-anchor="end">b</text><text class="ta" x="416" y="220" text-anchor="middle">Equilibrio: R₁R₄ = R₂R₃</text></svg>