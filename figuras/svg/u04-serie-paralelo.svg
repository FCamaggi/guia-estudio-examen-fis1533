x="120" y="76" text-anchor="middle">−</text><text class="tc" x="150" y="76" text-anchor="middle">+</text><text class="ta" x="165" y="76" text-anchor="middle">−</text><text class="t" x="135" y="136" text-anchor="middle">isla aislada (q neta = 0)</text><text class="ta" x="135" y="182" text-anchor="middle">Misma carga Q</text><text class="s" x="135" y="204" text-anchor="middle">V = V₁ + V₂</text><text class="s" x="290" y="105" text-anchor="end">a</text><text class="s" x="510" y="105" text-anchor="start">b</text><text class="s" x="400" y="40" text-anchor="middle">C₁</text><text class="s" x="400" y="169" text-anchor="middle">C₂</text><text class="ta" x="400" y="204" text-anchor="middle">Mismo voltaje V · Q = Q₁ + Q₂</text></svg>