<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 305" style="max-width:1053px" role="img" aria-label="Mapa del curso FIS1533: bloques A, B, C y D conectados por las cuatro ecuaciones de Maxwell y la fuerza de Lorentz">
<style>
  :root {
    --surface: #ffffff; --ink: #142030; --muted: #566273; --line: #d8dee7;
    --accent: #1f4fd1; --accent-soft: #e7edfc; --copper: #a85a18; --copper-soft: #f8eee4;
    --font-body: "Source Sans 3", "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #151c26; --ink: #e5eaf1; --muted: #9aa6b6; --line: #29323f;
      --accent: #84a6ff; --accent-soft: #1b2640; --copper: #e2a26b; --copper-soft: #2a2119;
    }
  }
  svg { background: var(--surface); font-family: var(--font-body); }
  .w { stroke: var(--ink); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .wk { stroke: var(--ink); stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .m { stroke: var(--muted); stroke-width: 1.2; fill: none; }
  .md { stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 4 4; fill: none; }
  .a { stroke: var(--accent); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ad { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
  .c { stroke: var(--copper); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .cd { stroke: var(--copper); stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
  .fld { stroke: var(--muted); stroke-width: 1.3; opacity: .38; }
  .fldl { stroke: var(--muted); stroke-width: 1.4; opacity: .6; fill: none; }
  .af { fill: var(--accent); } .cf { fill: var(--copper); } .wf, .inkf, .wkf { fill: var(--ink); }
  .mf, .mdf { fill: var(--muted); } .fldlf { fill: var(--muted); opacity: .6; }
  .adf { fill: var(--accent); } .cdf { fill: var(--copper); }
  .soft { fill: var(--accent-soft); } .csoft { fill: var(--copper-soft); } .paperf { fill: var(--surface); }
  .nostroke { stroke: none; } .nofill { fill: none; }
  .s, .sa, .sc { font: italic 17px "Times New Roman", "STIX Two Text", serif; fill: var(--ink); }
  .sa { fill: var(--accent); } .sc { fill: var(--copper); }
  .t { font: 12.5px var(--font-body); fill: var(--muted); }
  .tb { font: 600 14px var(--font-body); fill: var(--ink); }
  .tc { font: 600 13px var(--font-body); fill: var(--copper); }
  .ta { font: 600 13px var(--font-body); fill: var(--accent); }
  .tw { font: 700 13px var(--font-body); fill: var(--surface); }
  .gl-ink, .gl-acc, .gl-cop, .gl-mut, .gl-srf { fill: none; stroke-width: 1.2; stroke-linecap: round; }
  .gl-ink { stroke: var(--ink); } .gl-acc { stroke: var(--accent); } .gl-cop { stroke: var(--copper); }
  .gl-mut { stroke: var(--muted); } .gl-srf { stroke: var(--surface); }
  .glf-ink { fill: var(--ink); } .glf-acc { fill: var(--accent); } .glf-cop { fill: var(--copper); }
  .glf-mut { fill: var(--muted); } .glf-srf { fill: var(--surface); }
  .sb { font-size: 72%; }
</style>
<rect class="soft" x="16" y="18" width="156" height="108" rx="10"/><rect class="paperf" x="208" y="18" width="156" height="108" rx="10"/><rect class="csoft" x="400" y="18" width="156" height="108" rx="10"/><rect class="csoft" x="592" y="18" width="156" height="108" rx="10"/><rect class="paperf" x="16" y="162" width="748" height="126" rx="10"/><rect class="a nofill" x="16" y="18" width="156" height="108" rx="10"/><rect class="w nofill" x="208" y="18" width="156" height="108" rx="10"/><rect class="c nofill" x="400" y="18" width="156" height="108" rx="10"/><rect class="c nofill" x="592" y="18" width="156" height="108" rx="10"/><line class="md" x1="94" y1="130" x2="94" y2="158"/><line class="md" x1="286" y1="130" x2="286" y2="158"/><line class="md" x1="478" y1="130" x2="478" y2="158"/><line class="md" x1="670" y1="130" x2="670" y2="158"/><rect class="md nofill" x="16" y="162" width="748" height="126" rx="10"/><line class="m" x1="34" y1="263" x2="746" y2="263"/><line class="a" x1="174" y1="72" x2="198.0" y2="72.0"/><polygon class="af" points="206,72 198.0,76.0 198.0,68.0"/><line class="w" x1="366" y1="72" x2="390.0" y2="72.0"/><polygon class="inkf" points="398,72 390.0,76.0 390.0,68.0"/><line class="c" x1="558" y1="72" x2="582.0" y2="72.0"/><polygon class="cf" points="590,72 582.0,76.0 582.0,68.0"/><text class="ta" x="94" y="42" text-anchor="middle">A · Electrostática</text><text class="tb" x="94" y="62" text-anchor="middle">U1–U4</text><text class="t" x="94" y="86" text-anchor="middle">Cargas en reposo</text><text class="t" x="94" y="106" text-anchor="middle">E, V, C, dieléctricos</text><text class="tb" x="286" y="42" text-anchor="middle">B · Circuitos DC</text><text class="tb" x="286" y="62" text-anchor="middle">U5–U6</text><text class="t" x="286" y="86" text-anchor="middle">Corriente estacionaria</text><text class="t" x="286" y="106" text-anchor="middle">J, R, Kirchhoff, RC</text><text class="tc" x="478" y="42" text-anchor="middle">C · Magnetismo</text><text class="tb" x="478" y="62" text-anchor="middle">U7–U8</text><text class="t" x="478" y="86" text-anchor="middle">Corrientes y cargas</text><text class="t" x="478" y="106" text-anchor="middle">Fuerza q v×B, Biot-Savart</text><text class="tc" x="670" y="42" text-anchor="middle">D · Inducción y CA</text><text class="tb" x="670" y="62" text-anchor="middle">U9–U11</text><text class="t" x="670" y="86" text-anchor="middle">Campos variables</text><text class="t" x="670" y="106" text-anchor="middle">Faraday, L, RLC, ondas</text><text class="t" x="190" y="58" text-anchor="middle">ΔV</text><text class="t" x="382" y="58" text-anchor="middle">I</text><text class="t" x="574" y="58" text-anchor="middle">Φ(t)</text><text class="tb" x="390" y="184" text-anchor="middle">Las cuatro ecuaciones de Maxwell y la fuerza de Lorentz unen los cuatro bloques</text><text class="ta" x="106" y="208" text-anchor="middle">1. Gauss eléctrica</text><g><text class="s" x="46.8" y="232" text-anchor="start">∮ </text><text class="s" x="64.9" y="232" text-anchor="middle">E</text><line class="gl-ink" x1="62.8" y1="217.4" x2="69.3" y2="217.4"/><polygon class="glf-ink" points="70.8,217.4 65.4,214.8 65.4,219.9"/><text class="s" x="69.3" y="232" text-anchor="start"> · d</text><text class="s" x="97.5" y="232" text-anchor="middle">A</text><line class="gl-ink" x1="95.5" y1="217.4" x2="101.9" y2="217.4"/><polygon class="glf-ink" points="103.4,217.4 98.0,214.8 98.0,219.9"/><text class="s" x="101.9" y="232" text-anchor="start"> = Q / ε₀</text></g><text class="t" x="106" y="252" text-anchor="middle">Cargas crean campo E (U2)</text><text class="tb" x="286" y="208" text-anchor="middle">2. Gauss magnética</text><g><text class="s" x="244.9" y="232" text-anchor="start">∮ </text><text class="s" x="262.9" y="232" text-anchor="middle">B</text><line class="gl-ink" x1="260.9" y1="217.4" x2="267.3" y2="217.4"/><polygon class="glf-ink" points="268.8,217.4 263.4,214.8 263.4,219.9"/><text class="s" x="267.3" y="232" text-anchor="start"> · d</text><text class="s" x="295.5" y="232" text-anchor="middle">A</text><line class="gl-ink" x1="293.5" y1="217.4" x2="300.0" y2="217.4"/><polygon class="glf-ink" points="301.5,217.4 296.0,214.8 296.0,219.9"/><text class="s" x="299.9" y="232" text-anchor="start"> = 0</text></g><text class="t" x="286" y="252" text-anchor="middle">Sin monopolos (U7–U8)</text><text class="tc" x="466" y="208" text-anchor="middle">3. Faraday-Lenz</text><g><text class="s" x="391.2" y="232" text-anchor="start">∮ </text><text class="s" x="409.2" y="232" text-anchor="middle">E</text><line class="gl-ink" x1="407.2" y1="217.4" x2="413.7" y2="217.4"/><polygon class="glf-ink" points="415.2,217.4 409.7,214.8 409.7,219.9"/><text class="s" x="413.6" y="232" text-anchor="start"> · d</text><text class="s" x="441.9" y="232" text-anchor="middle">ℓ</text><line class="gl-ink" x1="439.8" y1="217.4" x2="446.3" y2="217.4"/><polygon class="glf-ink" points="447.8,217.4 442.4,214.8 442.4,219.9"/><text class="s" x="446.3" y="232" text-anchor="start"> = − dΦB / dt</text></g><text class="t" x="466" y="252" text-anchor="middle">B(t) crea E (U9)</text><text class="tc" x="658" y="208" text-anchor="middle">4. Ampère-Maxwell</text><g><text class="s" x="555.7" y="232" text-anchor="start">∮ </text><text class="s" x="573.7" y="232" text-anchor="middle">B</text><line class="gl-ink" x1="571.7" y1="217.4" x2="578.1" y2="217.4"/><polygon class="glf-ink" points="579.6,217.4 574.2,214.8 574.2,219.9"/><text class="s" x="578.1" y="232" text-anchor="start"> · d</text><text class="s" x="606.3" y="232" text-anchor="middle">ℓ</text><line class="gl-ink" x1="604.3" y1="217.4" x2="610.8" y2="217.4"/><polygon class="glf-ink" points="612.3,217.4 606.8,214.8 606.8,219.9"/><text class="s" x="610.7" y="232" text-anchor="start"> = μ₀(I + ε₀ dΦE/dt)</text></g><text class="t" x="658" y="252" text-anchor="middle">I y E(t) crean B (U8–U9)</text><text class="t" x="205" y="279" text-anchor="middle">Lorentz:  F = q(E + v × B)  (U1, U7)</text><text class="t" x="575" y="279" text-anchor="middle">Vacío (U11):  c = 1 / √(μ₀ ε₀) ≈ 3×10⁸ m/s</text></svg>