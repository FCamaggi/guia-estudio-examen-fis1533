214" text-anchor="middle">(a) Serie: dR = ρ dx / A(x)</text><text class="s" x="305.7" y="96.4" text-anchor="middle">a</text><text class="s" x="328.4" y="80.1" text-anchor="middle">b</text><text class="sa" x="274.302" y="82.3015" text-anchor="start">r</text><text class="t" x="298" y="214" text-anchor="middle">(b) Radial: A(r) = 2πrL</text><text class="s" x="498" y="83" text-anchor="middle">σ₁</text><text class="s" x="498" y="131" text-anchor="middle">σ₂</text><text class="s" x="420" y="107" text-anchor="end">a</text><text class="s" x="576" y="107" text-anchor="start">b</text><text class="t" x="498" y="214" text-anchor="middle">(c) Paralelo: 1/R = 1/R₁ + 1/R₂</text></svg>