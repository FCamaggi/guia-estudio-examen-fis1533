<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 235" style="max-width:621px" role="img" aria-label="Circuito de dos mallas con interruptor SPDT y dos capacitores C1 y C2">
<style>
  :root {
    --surface: #ffffff; --ink: #142030; --muted: #566273; --line: #d8dee7;
    --accent: #1f4fd1; --accent-soft: #e7edfc; --copper: #a85a18; --copper-soft: #f8eee4;
    --font-body: "Source Sans 3", "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #151c26; --ink: #e5eaf1; --muted: #9aa6b6; --line: #29323f;
      --accent: #84a6ff; --accent-soft: #1b2640; --copper: #e2a26b; --copper-soft: #2a2119;
    }
  }
  svg { background: var(--surface); font-family: var(--font-body); }
  .w { stroke: var(--ink); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .wk { stroke: var(--ink); stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .m { stroke: var(--muted); stroke-width: 1.2; fill: none; }
  .md { stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 4 4; fill: none; }
  .a { stroke: var(--accent); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ad { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
  .c { stroke: var(--copper); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .cd { stroke: var(--copper); stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
  .fld { stroke: var(--muted); stroke-width: 1.3; opacity: .38; }
  .fldl { stroke: var(--muted); stroke-width: 1.4; opacity: .6; fill: none; }
  .af { fill: var(--accent); } .cf { fill: var(--copper); } .wf, .inkf, .wkf { fill: var(--ink); }
  .mf, .mdf { fill: var(--muted); } .fldlf { fill: var(--muted); opacity: .6; }
  .adf { fill: var(--accent); } .cdf { fill: var(--copper); }
  .soft { fill: var(--accent-soft); } .csoft { fill: var(--copper-soft); } .paperf { fill: var(--surface); }
  .nostroke { stroke: none; } .nofill { fill: none; }
  .s, .sa, .sc { font: italic 17px "Times New Roman", "STIX Two Text", serif; fill: var(--ink); }
  .sa { fill: var(--accent); } .sc { fill: var(--copper); }
  .t { font: 12.5px var(--font-body); fill: var(--muted); }
  .tb { font: 600 14px var(--font-body); fill: var(--ink); }
  .tc { font: 600 13px var(--font-body); fill: var(--copper); }
  .ta { font: 600 13px var(--font-body); fill: var(--accent); }
  .tw { font: 700 13px var(--font-body); fill: var(--surface); }
  .gl-ink, .gl-acc, .gl-cop, .gl-mut, .gl-srf { fill: none; stroke-width: 1.2; stroke-linecap: round; }
  .gl-ink { stroke: var(--ink); } .gl-acc { stroke: var(--accent); } .gl-cop { stroke: var(--copper); }
  .gl-mut { stroke: var(--muted); } .gl-srf { stroke: var(--surface); }
  .glf-ink { fill: var(--ink); } .glf-acc { fill: var(--accent); } .glf-cop { fill: var(--copper); }
  .glf-mut { fill: var(--muted); } .glf-srf { fill: var(--surface); }
  .sb { font-size: 72%; }
</style>
<g transform="translate(60,48) rotate(90)"><line class="w" x1="0" y1="0" x2="63" y2="0"/><line class="w" x1="71" y1="0" x2="134" y2="0"/><line class="w" x1="63" y1="-15" x2="63" y2="15"/><line class="wk" x1="71" y1="-8" x2="71" y2="8"/></g><polyline class="w" points="60,48 160,48"/><g transform="translate(220,48) rotate(90)"><polyline class="w" points="0,0 11.7,0 15.4,8 22.6,-8 29.9,8 37.1,-8 44.4,8 51.6,-8 55.3,0 67,0"/></g><g transform="translate(220,115) rotate(90)"><line class="w" x1="0" y1="0" x2="28.5" y2="0"/><line class="w" x1="38.5" y1="0" x2="67" y2="0"/><line class="w" x1="28.5" y1="-14" x2="28.5" y2="14"/><line class="w" x1="38.5" y1="-14" x2="38.5" y2="14"/></g><polyline class="w" points="285,48 375,48"/><g transform="translate(375,48) rotate(90)"><polyline class="w" points="0,0 11.7,0 15.4,8 22.6,-8 29.9,8 37.1,-8 44.4,8 51.6,-8 55.3,0 67,0"/></g><g transform="translate(375,115) rotate(90)"><line class="w" x1="0" y1="0" x2="28.5" y2="0"/><line class="w" x1="38.5" y1="0" x2="67" y2="0"/><line class="w" x1="28.5" y1="-14" x2="28.5" y2="14"/><line class="w" x1="38.5" y1="-14" x2="38.5" y2="14"/></g><g transform="translate(60,182) rotate(0)"><polyline class="w" points="0,0 58,0 61.7,8 69,-8 76.3,8 83.7,-8 91,8 98.3,-8 102,0 160,0"/></g><polyline class="w" points="220,182 375,182"/><circle class="inkf" cx="160" cy="48" r="3.6"/><circle class="inkf" cx="220" cy="48" r="3.6"/><circle class="inkf" cx="285" cy="48" r="3.6"/><line class="w" x1="220" y1="48" x2="164.0" y2="48.0"/><line class="md" x1="220" y1="48" x2="281.0" y2="48.0"/><circle class="inkf" cx="220" cy="182" r="3.6"/><text class="s" x="38" y="120" text-anchor="end">E</text><text class="tb" x="84" y="106" text-anchor="middle">+</text><text class="tb" x="84" y="132" text-anchor="middle">−</text><text class="s" x="160" y="38" text-anchor="middle">1</text><text class="s" x="285" y="38" text-anchor="middle">2</text><text class="s" x="220" y="30" text-anchor="middle">S</text><text class="s" x="204" y="86.5" text-anchor="end">R₁</text><text class="s" x="202" y="153.5" text-anchor="end">C₁</text><text class="s" x="393" y="86.5" text-anchor="start">R₂</text><text class="s" x="393" y="153.5" text-anchor="start">C₂</text><text class="s" x="140" y="207" text-anchor="middle">R₃</text></svg>