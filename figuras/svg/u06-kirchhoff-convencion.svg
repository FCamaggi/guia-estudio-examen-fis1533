<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 358" style="max-width:675px" role="img" aria-label="Leyes de Kirchhoff: regla de nodos y convención de signos al recorrer una malla">
<style>
  :root {
    --surface: #ffffff; --ink: #142030; --muted: #566273; --line: #d8dee7;
    --accent: #1f4fd1; --accent-soft: #e7edfc; --copper: #a85a18; --copper-soft: #f8eee4;
    --font-body: "Source Sans 3", "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #151c26; --ink: #e5eaf1; --muted: #9aa6b6; --line: #29323f;
      --accent: #84a6ff; --accent-soft: #1b2640; --copper: #e2a26b; --copper-soft: #2a2119;
    }
  }
  svg { background: var(--surface); font-family: var(--font-body); }
  .w { stroke: var(--ink); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .wk { stroke: var(--ink); stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .m { stroke: var(--muted); stroke-width: 1.2; fill: none; }
  .md { stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 4 4; fill: none; }
  .a { stroke: var(--accent); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ad { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
  .c { stroke: var(--copper); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .cd { stroke: var(--copper); stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
  .fld { stroke: var(--muted); stroke-width: 1.3; opacity: .38; }
  .fldl { stroke: var(--muted); stroke-width: 1.4; opacity: .6; fill: none; }
  .af { fill: var(--accent); } .cf { fill: var(--copper); } .wf, .inkf, .wkf { fill: var(--ink); }
  .mf, .mdf { fill: var(--muted); } .fldlf { fill: var(--muted); opacity: .6; }
  .adf { fill: var(--accent); } .cdf { fill: var(--copper); }
  .soft { fill: var(--accent-soft); } .csoft { fill: var(--copper-soft); } .paperf { fill: var(--surface); }
  .nostroke { stroke: none; } .nofill { fill: none; }
  .s, .sa, .sc { font: italic 17px "Times New Roman", "STIX Two Text", serif; fill: var(--ink); }
  .sa { fill: var(--accent); } .sc { fill: var(--copper); }
  .t { font: 12.5px var(--font-body); fill: var(--muted); }
  .tb { font: 600 14px var(--font-body); fill: var(--ink); }
  .tc { font: 600 13px var(--font-body); fill: var(--copper); }
  .ta { font: 600 13px var(--font-body); fill: var(--accent); }
  .tw { font: 700 13px var(--font-body); fill: var(--surface); }
  .gl-ink, .gl-acc, .gl-cop, .gl-mut, .gl-srf { fill: none; stroke-width: 1.2; stroke-linecap: round; }
  .gl-ink { stroke: var(--ink); } .gl-acc { stroke: var(--accent); } .gl-cop { stroke: var(--copper); }
  .gl-mut { stroke: var(--muted); } .gl-srf { stroke: var(--surface); }
  .glf-ink { fill: var(--ink); } .glf-acc { fill: var(--accent); } .glf-cop { fill: var(--copper); }
  .glf-mut { fill: var(--muted); } .glf-srf { fill: var(--surface); }
  .sb { font-size: 72%; }
</style>
<polyline class="w" points="25,160 95,160"/><polyline class="w" points="95,160 155,102"/><polyline class="w" points="95,160 155,212"/><line class="md" x1="182" y1="16" x2="182" y2="342"/><g transform="translate(212,66) rotate(0)"><polyline class="w" points="0,0 40,0 43.7,8 51,-8 58.3,8 65.7,-8 73,8 80.3,-8 84,0 124,0"/></g><g transform="translate(212,148) rotate(0)"><polyline class="w" points="0,0 40,0 43.7,8 51,-8 58.3,8 65.7,-8 73,8 80.3,-8 84,0 124,0"/></g><g transform="translate(212,230) rotate(0)"><line class="w" x1="0" y1="0" x2="58" y2="0"/><line class="w" x1="66" y1="0" x2="124" y2="0"/><line class="wk" x1="58" y1="-8" x2="58" y2="8"/><line class="w" x1="66" y1="-15" x2="66" y2="15"/></g><g transform="translate(212,306) rotate(0)"><line class="w" x1="0" y1="0" x2="58" y2="0"/><line class="w" x1="66" y1="0" x2="124" y2="0"/><line class="w" x1="58" y1="-15" x2="58" y2="15"/><line class="wk" x1="66" y1="-8" x2="66" y2="8"/></g><circle class="inkf" cx="95" cy="160" r="3.6"/><line class="a" x1="34" y1="146" x2="66.0" y2="146.0"/><polygon class="af" points="74,146 66.0,150.0 66.0,142.0"/><line class="a" x1="114" y1="132" x2="140.3" y2="105.7"/><polygon class="af" points="146,100 143.2,108.5 137.5,102.8"/><line class="a" x1="114" y1="188" x2="140.3" y2="214.3"/><polygon class="af" points="146,220 137.5,217.2 143.2,211.5"/><circle class="inkf" cx="212" cy="66" r="3.6"/><circle class="inkf" cx="336" cy="66" r="3.6"/><line class="a" x1="248" y1="86" x2="292.0" y2="86.0"/><polygon class="af" points="300,86 292.0,90.0 292.0,82.0"/><circle class="inkf" cx="212" cy="148" r="3.6"/><circle class="inkf" cx="336" cy="148" r="3.6"/><line class="a" x1="300" y1="168" x2="256.0" y2="168.0"/><polygon class="af" points="248,168 256.0,164.0 256.0,172.0"/><circle class="inkf" cx="212" cy="230" r="3.6"/><circle class="inkf" cx="336" cy="230" r="3.6"/><circle class="inkf" cx="212" cy="306" r="3.6"/><circle class="inkf" cx="336" cy="306" r="3.6"/><text class="tb" x="98" y="24" text-anchor="middle">Regla de nodos (LCK)</text><text class="s" x="95" y="182" text-anchor="middle">nodo</text><text class="sa" x="54" y="138" text-anchor="middle">I₁</text><text class="sa" x="130" y="102" text-anchor="middle">I₂</text><text class="sa" x="130" y="224" text-anchor="middle">I₃</text><text class="tb" x="95" y="272" text-anchor="middle">I₁ = I₂ + I₃</text><text class="t" x="95" y="294" text-anchor="middle">∑ I entran = ∑ I salen</text><text class="tb" x="340" y="24" text-anchor="middle">Regla de mallas (recorrido a → b)</text><text class="s" x="212" y="56" text-anchor="middle">a</text><text class="s" x="336" y="56" text-anchor="middle">b</text><text class="s" x="274" y="48" text-anchor="middle">R</text><text class="sa" x="274" y="105" text-anchor="middle">I</text><text class="tb" x="360" y="70" text-anchor="start">ΔV = −IR</text><text class="s" x="212" y="138" text-anchor="middle">a</text><text class="s" x="336" y="138" text-anchor="middle">b</text><text class="s" x="274" y="130" text-anchor="middle">R</text><text class="sa" x="274" y="187" text-anchor="middle">I</text><text class="tb" x="360" y="152" text-anchor="start">ΔV = +IR</text><text class="s" x="212" y="220" text-anchor="middle">a</text><text class="s" x="336" y="220" text-anchor="middle">b</text><text class="s" x="274" y="212" text-anchor="middle">ε</text><text class="tb" x="261" y="258" text-anchor="middle">−</text><text class="tb" x="287" y="258" text-anchor="middle">+</text><text class="tb" x="360" y="234" text-anchor="start">ΔV = +ε</text><text class="s" x="212" y="296" text-anchor="middle">a</text><text class="s" x="336" y="296" text-anchor="middle">b</text><text class="s" x="274" y="288" text-anchor="middle">ε</text><text class="tb" x="261" y="334" text-anchor="middle">+</text><text class="tb" x="287" y="334" text-anchor="middle">−</text><text class="tb" x="360" y="310" text-anchor="start">ΔV = −ε</text></svg>