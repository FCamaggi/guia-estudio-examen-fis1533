x2="352.9" y2="107.4"/><polygon class="glf-ink" points="354.4,107.4 349.0,104.8 349.0,109.9"/></g><text class="t" x="358" y="122" text-anchor="start">en toda la esfera</text><g><text class="s" x="308.0" y="148" text-anchor="start">∮ </text><text class="s" x="326.0" y="148" text-anchor="middle">E</text><line class="gl-ink" x1="324.0" y1="133.4" x2="330.5" y2="133.4"/><polygon class="glf-ink" points="332.0,133.4 326.5,130.8 326.5,135.9"/><text class="s" x="330.4" y="148" text-anchor="start">·d</text><text class="s" x="349.1" y="148" text-anchor="middle">A</text><line class="gl-ink" x1="347.1" y1="133.4" x2="353.6" y2="133.4"/><polygon class="glf-ink" points="355.1,133.4 349.6,130.8 349.6,135.9"/><text class="s" x="353.6" y="148" text-anchor="start"> = E (4πr²)</text></g><text class="t" x="308" y="178" text-anchor="start">r₁ &lt; R   y   r₂ &gt; R</text></svg>