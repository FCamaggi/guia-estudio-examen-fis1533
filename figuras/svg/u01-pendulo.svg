-cop" x1="247.8" y1="156.0" x2="254.2" y2="156.0"/><polygon class="glf-cop" points="255.7,156.0 250.3,153.4 250.3,158.5"/><text class="sc" x="254.2" y="170.6" text-anchor="start">ₑ</text></g></svg>