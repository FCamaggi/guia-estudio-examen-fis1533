sa" x="190.6" y="48" text-anchor="middle">E</text><line class="gl-acc" x1="188.6" y1="33.4" x2="195.0" y2="33.4"/><polygon class="glf-acc" points="196.5,33.4 191.1,30.8 191.1,35.9"/><text class="sa" x="195.0" y="48" text-anchor="start">₁</text></g><g><text class="sc" x="190.6" y="78" text-anchor="middle">E</text><line class="gl-cop" x1="188.6" y1="63.4" x2="195.0" y2="63.4"/><polygon class="glf-cop" points="196.5,63.4 191.1,60.8 191.1,65.9"/><text class="sc" x="195.0" y="78" text-anchor="start">₂</text></g><text class="tc" x="195" y="190" text-anchor="middle">nunca se anulan</text><text class="tb" x="375" y="22" text-anchor="middle">x &gt; d</text><g><text class="sa" x="393.6" y="62" text-anchor="middle">E</text><line class="gl-acc" x1="391.6" y1="47.4" x2="398.0" y2="47.4"/><polygon class="glf-acc" points="399.5,47.4 394.1,44.8 394.1,49.9"/><text class="sa" x="398.0" y="62" text-anchor="start">₁</text></g><g><text class="sc" x="347.6" y="62" text-anchor="middle">E</text><line class="gl-cop" x1="345.6" y1="47.4" x2="352.0" y2="47.4"/><polygon class="glf-cop" points="353.5,47.4 348.1,44.8 348.1,49.9"/><text class="sc" x="352.0" y="62" text-anchor="start">₂</text></g></svg>